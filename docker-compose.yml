# Local PostgreSQL for development:  docker compose up -d
# Then set DATABASE_URL="postgresql://vice:vice@localhost:5432/vice_dev"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vice
      POSTGRES_PASSWORD: vice
      POSTGRES_DB: vice_dev
    ports:
      - "5432:5432"
    volumes:
      - vice-db:/var/lib/postgresql/data
volumes:
  vice-db:
